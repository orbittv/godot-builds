name: Build Custom 2D Android Template

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Версия Godot (например, 4.7.2-stable)'
        required: true
        default: '4.7.2-stable'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java Sdk
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Clone Godot Engine Source
        run: |
          # Передаем введенную версию напрямую в качестве тега
          VERSION_TAG="${{ github.event.inputs.godot_version }}"
          git clone --depth 1 --branch "$VERSION_TAG" https://github.com godot-source

      - name: Copy Custom Profile
        run: |
          if [ -f "./custom.py" ]; then
            cp ./custom.py ./godot-source/custom.py
            echo "Файл custom.py успешно применен!"
          else
            echo "Внимание: custom.py не найден в корне репозитория, сборка пройдет со стандартными настройками."
          fi

      - name: Build Android Template (ARM64)
        run: |
          cd godot-source
          scons platform=android target=template_release arch=arm64 generate_apk=yes

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-2d-template
          path: ./godot-source/bin/*.apk
