name: Build Custom 2D Android Template

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Версия Godot (например: 4.7.2-stable)'
        required: true
        default: '4.7.2-stable'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom profile
        uses: actions/checkout@v4

      - name: Clone Godot Engine Source
        uses: actions/checkout@v4
        with:
          repository: 'godotengine/godot'
          ref: ${{ github.event.inputs.godot_version }}
          path: 'godot-source'
          fetch-depth: 1

      - name: Set up Java Sdk
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Copy Custom Profile
        run: |
          if [ -f "./custom.py" ]; then
            cp ./custom.py ./godot-source/custom.py
            echo "Файл custom.py успешно применен!"
          else
            echo "Внимание: custom.py не найден в корне репозитория, сборка пройдет со стандартными настройками."
          fi

      # Шаг 1: Собираем релизный шаблон
      - name: Build Android Template (Release - ARM64)
        run: |
          cd godot-source
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle
          scons platform=android target=template_release arch=arm64 generate_apk=yes

      # Шаг 2: Собираем дебаг шаблон
      - name: Build Android Template (Debug - ARM64)
        run: |
          cd godot-source
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle
          scons platform=android target=template_debug arch=arm64 generate_apk=yes

      # Шаг 3: Выгружаем оба APK файла
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-2d-template
          path: ./godot-source/bin/*.apk
